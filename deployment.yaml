apiVersion: apps/v1
kind: Deployment

metadata:
  name: vicky13-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: vicky13

  template:
    metadata:
      labels:
        app: vicky13

    spec:
      containers:
        - name: vicky13-container
          image: vickydoc13/vicky13:IMAGE_TAG

          ports:
            - containerPort: 8080
